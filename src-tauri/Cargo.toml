[package]
name = "codecity"
description = "CodeCity Desktop App"
authors = ["CodeCity"]
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "codecity"

[lib]
name = "codecity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pure analysis engine — moved to its own crate. Tauri app is now a thin
# wrapper that handles RPC, persistence, and HTTP fetches.
codecity-core = { path = "../crates/codecity-core" }

# App-layer dependencies (Tauri / persistence / HTTP / OAuth)
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
dirs = "6"
once_cell.workspace = true
regex.workspace = true
zip = "2"
thiserror.workspace = true
keyring = { version = "3", features = ["apple-native"] }
trash = "5"
