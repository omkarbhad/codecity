name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
      # Build provenance: lets anyone check a download was built from this repository.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            opengrep-asset: opengrep_osx_arm64
            opengrep-sha256: b51b3d83f165a2e0934497b8f1b08abb1c3041ef20ef911c97e04cb39af1ad55
          - label: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            opengrep-asset: opengrep_osx_x86
            opengrep-sha256: 51d2f918d7aad0afc1426bb4fbf56e32fc70c3ffd5ddb78e32e7d61e51c029a2
          - label: Windows
            platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
            triple: x86_64-pc-windows-msvc
            opengrep-asset: opengrep_windows_x86.zip
            opengrep-sha256: 899a17e2b15863367cfd15032c93cdf482fd4e7ec8719c69de46f4f38b227864

    runs-on: ${{ matrix.platform }}

    env:
      OPENGREP_VERSION: v2.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The security scan runs opengrep as a sidecar, and Tauri refuses to build without
      # the file for the target. Each download is pinned to a checksum.
      - name: Fetch opengrep sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o "src-tauri/binaries/opengrep-${{ matrix.triple }}" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${{ matrix.opengrep-asset }}"
          echo "${{ matrix.opengrep-sha256 }}  src-tauri/binaries/opengrep-${{ matrix.triple }}" | shasum -a 256 -c -
          chmod +x "src-tauri/binaries/opengrep-${{ matrix.triple }}"

      # The Windows build is a zip: opengrep.exe plus the DLLs it loads from its own folder.
      # The exe becomes the sidecar; the DLLs ship beside it (see src-tauri/tauri.windows.conf.json).
      - name: Fetch opengrep sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/opengrep/opengrep/releases/download/$env:OPENGREP_VERSION/${{ matrix.opengrep-asset }}" -OutFile opengrep.zip
          $hash = (Get-FileHash opengrep.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ matrix.opengrep-sha256 }}") { throw "opengrep checksum mismatch: $hash" }
          Expand-Archive opengrep.zip -DestinationPath opengrep-unpacked
          New-Item -ItemType Directory -Force src-tauri/binaries/windows-dlls | Out-Null
          Move-Item opengrep-unpacked/opengrep.exe "src-tauri/binaries/opengrep-${{ matrix.triple }}.exe"
          Move-Item opengrep-unpacked/*.dll src-tauri/binaries/windows-dlls/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        if: matrix.rust-targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust targets
        if: matrix.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm type-check

      - name: Build and publish Tauri release
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: CodeCity v__VERSION__
          releaseBody: |
            CodeCity desktop release for macOS and Windows.

            Download the .dmg for macOS (Apple silicon or Intel) or the setup .exe for Windows from the assets below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: CodeCity-[version]-[platform]-[arch][setup].[ext]

      # One signed statement per installer and updater file, recorded in GitHub's
      # attestation store. Check a download with: gh attestation verify <file> --repo omkarbhad/codecity
      - name: List the files that were built
        id: artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo "paths<<EOF"
            echo "$ARTIFACT_PATHS" | jq -r '.[]'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}
