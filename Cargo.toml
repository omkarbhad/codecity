# Cargo workspace root.
#
# `codecity-core` — pure code-analysis library (tree-sitter parsing, import
#   resolution, network analysis, city layout). Zero I/O, zero app deps.
#   Reusable from anywhere: the Tauri app, the CLI, future MCP servers,
#   GitHub Actions, etc.
#
# `codecity-cli`  — thin CLI wrapper (`codecity analyze ...`).
#
# `codecity-mcp`  — MCP server exposing snapshot queries to LLM agents.
#   Same data shape graphify uses; talks rmcp over stdio.
#
# `src-tauri`     — desktop app. Owns DB/HTTP/RPC, depends on codecity-core.

[workspace]
resolver = "2"
members = [
    "crates/codecity-core",
    "crates/codecity-cli",
    "crates/codecity-mcp",
    "src-tauri",
]
default-members = ["src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

# Shared dependency versions — pin once here, reference with `.workspace = true`
# from each member. Avoids drift between core / cli / app.
[workspace.dependencies]
# Pure analysis deps
serde = { version = "1", features = ["derive"] }
ignore = "0.4"  # ripgrep's gitignore-aware filesystem walker
serde_json = "1"
thiserror = "2"
log = "0.4"
rayon = "1.10"
regex = "1"
once_cell = "1"

# Tree-sitter family
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-markdown = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1"
tree-sitter-bash = "0.25"
tree-sitter-toml = "0.20"
tree-sitter-zig = "1"
tree-sitter-lua = "0.5"
tree-sitter-haskell = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-scala = "0.26"
tree-sitter-r = "1.2"
tree-sitter-julia = "0.23"
tree-sitter-perl = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-erlang = "0.16"
tree-sitter-dockerfile = "0.2"
tree-sitter-nix = "0.3"
tree-sitter-glsl = "0.2"
tree-sitter-make = "1.1"
tree-sitter-ocaml = "0.24"
tree-sitter-wgsl = "0.0.6"
tree-sitter-groovy = "0.1"
tree-sitter-graphql = "0.1"
tree-sitter-elisp = "1.6"
tree-sitter-hcl = "1.1"
tree-sitter-proto = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

# MCP — official Rust SDK from modelcontextprotocol/rust-sdk
rmcp = { version = "1.6", features = ["default", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
anyhow = "1"
